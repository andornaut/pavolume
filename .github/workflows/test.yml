name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      # pavolume links against libpulse, which the runner image does not carry.
      - name: Install PulseAudio headers
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev

      - name: Build
        run: make

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # A wheel carrying the cppcheck binary, so the pin sits in a manifest
      # Dependabot reads rather than in an apt package name the runner image
      # decides the version of.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The compiler already runs with -Wall -Wextra -pedantic in the Build job.
      # cppcheck is the part gcc does not do: it reads the whole translation
      # unit for use-after-free, leaks and unchecked returns rather than
      # diagnosing statement by statement.
      #
      # Without libpulse's headers: cppcheck reports every unresolved type as a
      # separate finding, and this is a check on what is written here rather
      # than on PulseAudio's API. --check-level=exhaustive because one 300-line
      # file is nowhere near the budget the normal level exists to protect.
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c99 \
            --error-exitcode=1 \
            --inline-suppr \
            --check-level=exhaustive \
            --suppressions-list=.cppcheck-suppressions \
            pavolume.c
